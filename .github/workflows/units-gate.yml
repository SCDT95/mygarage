name: Unit Gate Selftest

# The unit gate's mutation harness: every deliberate defect in
# units_gate_selftest.py's MUTATIONS and WALK_MUTATIONS tables, applied to a copy of
# scripts/validate-units.ts or of eslint.config.js, each of which must flip
# exactly the corpus cases that name it, plus the tree-walk and baseline proofs.
# The count is deliberately not written here: the run prints it, and a number in
# prose is a number that goes stale. An earlier version of this comment said 40
# when the tables held 44.
#
# Why it is a workflow of its own rather than a step in the main CI job:
#
#   * it re-runs a whole corpus leg per mutation. MEASURED at
#     3 min 38 s, not the ~18 minutes an earlier version of this comment
#     claimed. That figure was inferred from spaced polling rather than timed,
#     and it was wrong by 5x in the direction that would have justified
#     weakening the check. Keeping it off every PR's critical path is now a
#     matter of tidiness rather than cost;
#   * the set of files that can change its result is small and knowable, so a
#     `paths:` filter is exact rather than a guess: the gate, the corpus, this
#     harness, eslint.config.js, translation-utils.ts (the gate imports ROOT
#     from it), and package.json plus bun.lock, because a TypeScript or ESLint
#     major genuinely can change what the mutations do. The dependency files
#     were excluded while this job was believed to cost 18 minutes, with a
#     manual "run it after a major" obligation standing in. At the measured
#     3m38s that trade is gone, and an obligation nobody will remember after a
#     major bump is worse than a job that runs on bumps;
#   * SAMPLING IT IS NOT AN OPTION. Which mutant survives is not knowable in
#     advance, which is the entire premise of a mutation harness, so a sampled
#     run is how a survivor hides. At under four minutes there is no case for
#     sampling anyway.
#
# ★ Deliberately NOT a required check. A required check with a `paths:` filter
# never reports on the PRs it filters out, which leaves those PRs wedged waiting
# for a status that will never arrive. Keep this out of branch protection and
# that hazard does not apply. The corpus it mutates DOES run on every PR, inside
# `validate:translations` in the required Frontend Tests job, so the loosening
# direction is guarded continuously and only the harness proving the corpus is
# occasional.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/scripts/validate-units.ts'
      - 'frontend/scripts/units_gate_corpus.py'
      - 'frontend/scripts/units_gate_selftest.py'
      - 'frontend/eslint.config.js'
      - 'frontend/scripts/translation-utils.ts'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - '.github/workflows/units-gate.yml'
  pull_request:
    paths:
      - 'frontend/scripts/validate-units.ts'
      - 'frontend/scripts/units_gate_corpus.py'
      - 'frontend/scripts/units_gate_selftest.py'
      - 'frontend/eslint.config.js'
      - 'frontend/scripts/translation-utils.ts'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - '.github/workflows/units-gate.yml'
  workflow_dispatch:

concurrency:
  group: units-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    name: Unit Gate Selftest (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'

      # The gate loads the real TypeScript compiler out of node_modules to
      # resolve what an identifier refers to, and the ESLint leg needs the
      # plugin closure, so the install is not optional here.
      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      # Never piped: a pipe would mask the exit code, which is the only thing
      # this job reports.
      - name: Run the unit gate selftest
        run: cd frontend && bun run validate:units-selftest
